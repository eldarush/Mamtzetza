name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore Mamtzetza.slnx --configfile NuGet.config
    - name: Build
      run: dotnet build Mamtzetza.slnx --no-restore -c Release
    - name: Run Unit Tests
      run: dotnet test Mamtzetza.slnx --no-build -c Release --verbosity normal
    - name: Build Docker Image
      run: docker build -t mamtzetza:latest .
